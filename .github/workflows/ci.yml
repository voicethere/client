name: CI

on:
  pull_request:
    branches: [main]
  push:
    tags: ["release/*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/release/')
    uses: ./.github/workflows/test.yml

  quality:
    if: startsWith(github.ref, 'refs/tags/release/')
    uses: ./.github/workflows/test.yml
    with:
      force_test: true

  publish:
    if: startsWith(github.ref, 'refs/tags/release/')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: "@voicethere"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          if [ -z "$VERSION" ]; then
            echo "Could not parse version from tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing @voicethere/client@${VERSION}"

      - name: Check CHANGELOG entry
        run: bash scripts/ci/check-changelog-entry.sh "${{ steps.version.outputs.version }}"

      - name: Set package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build publishable dist
        run: npm run build

      - name: Verify npm auth
        run: npm whoami

      - name: Configure npm registry auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check whether this version is already on npm
        id: exists
        run: |
          if bash scripts/ci/npm-version-exists.sh @voicethere/client "${{ steps.version.outputs.version }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.exists.outputs.exists != 'true'
        run: npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish
        if: steps.exists.outputs.exists == 'true'
        run: echo "already published, skipping"

      - name: Verify package on registry
        run: bash scripts/ci/wait-for-npm-package.sh @voicethere/client "${{ steps.version.outputs.version }}"
        env:
          NPM_REGISTRY_VERIFY_TIMEOUT_SECONDS: 900
